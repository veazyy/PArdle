<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PArdle - Hematology PANCE Review</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="h-full flex flex-col font-sans antialiased" x-data="pardleApp()" x-init="initApp()">

  <!-- Header Navigation -->
  <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50 px-4 py-3">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <span class="text-2xl font-black tracking-wider text-rose-500">PArdle</span>
        <span class="text-xs px-2 py-0.5 rounded bg-rose-500/10 text-rose-400 border border-rose-500/20 font-medium">Hematology</span>
      </div>

      <div class="flex items-center space-x-2">
        <button @click="mode = 'daily'; resetGame()" :class="mode === 'daily' ? 'bg-rose-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition">Daily Case</button>
        <button @click="mode = 'practice'; resetGame()" :class="mode === 'practice' ? 'bg-rose-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition">Practice Mode</button>
        <button @click="showStats = !showStats" class="p-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition" title="Stats">
          📊
        </button>
      </div>
    </div>
  </header>

  <!-- Main Layout -->
  <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
    
    <!-- Game Play Area (2 Columns on Large Screens) -->
    <section class="lg:col-span-2 space-y-6">
      
      <!-- Category Filter Bar (Practice Mode Only) -->
      <template x-if="mode === 'practice'">
        <div class="bg-slate-800/50 p-3 rounded-xl border border-slate-700/50 space-y-2">
          <div class="text-xs font-bold text-slate-400 uppercase tracking-wider">Filter Category</div>
          <select x-model="selectedCategory" @change="resetGame()" class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-lg p-2 focus:ring-2 focus:ring-rose-500 outline-none">
            <option value="All">All Hematology Categories</option>
            <template x-for="cat in categories" :key="cat">
              <option :value="cat" x-text="cat"></option>
            </template>
          </select>
        </div>
      </template>

      <!-- Progressive Clues Box -->
      <div class="bg-slate-950/60 rounded-2xl border border-slate-800 p-5 space-y-4 shadow-xl">
        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
          <div class="flex items-center space-x-2">
            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Clinical Clues</span>
            <span class="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-300 font-mono" x-text="`Clue ${currentClueIndex + 1} of 5`"></span>
          </div>
          <span class="text-xs font-semibold text-rose-400" x-text="currentCondition ? currentCondition.category : ''"></span>
        </div>

        <div class="space-y-3">
          <template x-for="(clue, index) in currentClues" :key="index">
            <div x-show="index <= currentClueIndex" class="p-3.5 rounded-xl border transition-all duration-300" :class="index === currentClueIndex ? 'bg-slate-800/80 border-rose-500/40 text-slate-100 shadow-md' : 'bg-slate-900/40 border-slate-800 text-slate-400'">
              <div class="text-xs font-bold text-rose-400/80 mb-1" x-text="`Clue ${index + 1}`"></div>
              <div class="text-sm leading-relaxed" x-text="clue"></div>
            </div>
          </template>
        </div>
      </div>

      <!-- User Guess Input Area -->
      <div x-show="!gameStatus" class="space-y-3 relative">
        <div class="relative">
          <input 
            type="text" 
            x-model="guessInput" 
            @input="filterOptions()" 
            @keydown.enter="submitGuess(guessInput)"
            placeholder="Type condition diagnosis..." 
            class="w-full bg-slate-950 border border-slate-700 text-slate-100 placeholder-slate-500 text-sm rounded-xl px-4 py-3 focus:outline-none focus:border-rose-500 focus:ring-1 focus:ring-rose-500 transition"
          />
          <button 
            @click="submitGuess(guessInput)"
            class="absolute right-2 top-2 bottom-2 px-4 bg-rose-600 hover:bg-rose-500 text-white font-semibold text-xs rounded-lg transition"
          >
            Submit
          </button>
        </div>

        <!-- Dropdown Autocomplete Options -->
        <div x-show="filteredOptions.length > 0 && guessInput.trim().length > 0" class="absolute z-20 w-full bg-slate-900 border border-slate-700 rounded-xl max-h-48 overflow-y-auto shadow-2xl space-y-1 p-1">
          <template x-for="option in filteredOptions" :key="option">
            <button 
              @click="submitGuess(option)" 
              class="w-full text-left px-3 py-2 text-xs text-slate-200 hover:bg-rose-600 hover:text-white rounded-lg transition"
              x-text="option"
            ></button>
          </template>
        </div>
      </div>

      <!-- Win / Lose End Game Card -->
      <div x-show="gameStatus" x-cloak class="p-6 rounded-2xl border space-y-4 text-center transition-all" :class="gameStatus === 'won' ? 'bg-emerald-950/30 border-emerald-500/30' : 'bg-rose-950/30 border-rose-500/30'">
        <div class="text-2xl font-black" :class="gameStatus === 'won' ? 'text-emerald-400' : 'text-rose-400'" x-text="gameStatus === 'won' ? '🎉 Correct Diagnosis!' : '❌ Case Unsolved'"></div>
        
        <div class="text-lg font-bold text-slate-100" x-text="currentCondition ? currentCondition.name : ''"></div>

        <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-800 text-left space-y-2 text-xs">
          <div><strong class="text-rose-400">Clinical Pearl:</strong> <span class="text-slate-300" x-text="currentCondition ? currentCondition.pearl : ''"></span></div>
          <div><strong class="text-emerald-400">Lab Pattern:</strong> <span class="text-slate-300" x-text="currentCondition ? currentCondition.labs : ''"></span></div>
          <div><strong class="text-sky-400">Summary:</strong> <span class="text-slate-300" x-text="currentCondition ? currentCondition.summary : ''"></span></div>
        </div>

        <button @click="resetGame()" class="px-6 py-2.5 bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold rounded-xl transition shadow-lg">
          Next Practice Case
        </button>
      </div>

    </section>

    <!-- Side Panel: Stats & Guesses Log -->
    <aside class="space-y-6">
      
      <!-- Current Guesses Log -->
      <div class="bg-slate-950/60 rounded-2xl border border-slate-800 p-4 space-y-3">
        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Attempt Log</h3>
        <div class="space-y-2">
          <template x-for="(attempt, index) in attempts" :key="index">
            <div class="flex items-center justify-between p-2.5 rounded-lg bg-slate-900 border border-slate-800 text-xs">
              <span class="text-slate-300 font-medium" x-text="attempt.name"></span>
              <span class="text-rose-400 font-bold" x-text="`Clue ${attempt.clueNum}`"></span>
            </div>
          </template>
          <template x-if="attempts.length === 0">
            <div class="text-xs text-slate-600 py-4 text-center">No guesses submitted yet</div>
          </template>
        </div>
      </div>

      <!-- Strengths & Weaknesses Panel -->
      <div class="bg-slate-950/60 rounded-2xl border border-slate-800 p-4 space-y-4">
        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Performance Insights</h3>
        
        <div class="space-y-2">
          <div class="text-xs font-semibold text-emerald-400">Top 3 Strongest Conditions</div>
          <div class="space-y-1">
            <template x-for="item in topStrong" :key="item.name">
              <div class="flex justify-between text-xs p-1.5 rounded bg-slate-900 text-slate-300">
                <span x-text="item.name"></span>
                <span class="text-emerald-400 font-mono" x-text="`${item.score}%`"></span>
              </div>
            </template>
          </div>
        </div>

        <div class="space-y-2">
          <div class="text-xs font-semibold text-rose-400">Top 3 Needs Work</div>
          <div class="space-y-1">
            <template x-for="item in topWeak" :key="item.name">
              <div class="flex justify-between text-xs p-1.5 rounded bg-slate-900 text-slate-300">
                <span x-text="item.name"></span>
                <span class="text-rose-400 font-mono" x-text="`${item.score}%`"></span>
              </div>
            </template>
          </div>
        </div>
      </div>

    </aside>
  </main>

        initApp() {
          this.loadStats();
          this.resetGame();
        },

        loadStats() {
          const saved = localStorage.getItem('pardle_stats');
          if (saved) {
            try {
              this.stats = JSON.parse(saved);
            } catch (e) {
              console.error("Error loading stats", e);
            }
          }
          this.updateInsights();
        },

        saveStats() {
          localStorage.setItem('pardle_stats', JSON.stringify(this.stats));
          this.updateInsights();
        },

        updateInsights() {
          const list = [];
          for (const cond of this.conditions) {
            const st = this.stats.conditionStats[cond.name];
            if (st && st.total > 0) {
              const pct = Math.round((st.wins / st.total) * 100);
              list.push({ name: cond.name, score: pct, total: st.total });
            }
          }

          list.sort((a, b) => b.score - a.score || b.total - a.total);
          this.topStrong = list.slice(0, 3);
          
          const sortedWeak = [...list].sort((a, b) => a.score - b.score || b.total - a.total);
          this.topWeak = sortedWeak.slice(0, 3);
        },

        resetGame() {
          this.attempts = [];
          this.currentClueIndex = 0;
          this.gameStatus = null;
          this.guessInput = '';
          this.filteredOptions = [];

          let pool = this.conditions;
          if (this.mode === 'practice' && this.selectedCategory !== 'All') {
            pool = this.conditions.filter(c => c.category === this.selectedCategory);
          }

          if (pool.length === 0) pool = this.conditions;

          if (this.mode === 'daily') {
            const todayStr = new Date().toISOString().slice(0, 10);
            let hash = 0;
            for (let i = 0; i < todayStr.length; i++) {
              hash = todayStr.charCodeAt(i) + ((hash << 5) - hash);
            }
            const index = Math.abs(hash) % pool.length;
            this.currentCondition = pool[index];
          } else {
            const randomIndex = Math.floor(Math.random() * pool.length);
            this.currentCondition = pool[randomIndex];
          }

          this.currentClues = this.currentCondition.clues;
        },

        filterOptions() {
          const q = this.guessInput.trim().toLowerCase();
          if (!q) {
            this.filteredOptions = [];
            return;
          }
          this.filteredOptions = this.conditions
            .map(c => c.name)
            .filter(name => name.toLowerCase().includes(q));
        },

        submitGuess(guess) {
          if (!guess || this.gameStatus) return;

          const matched = this.conditions.find(c => c.name.toLowerCase() === guess.trim().toLowerCase());
          if (!matched) return;

          const guessName = matched.name;
          const currentClueNum = this.currentClueIndex + 1;

          this.attempts.push({
            name: guessName,
            clueNum: currentClueNum
          });

          this.guessInput = '';
          this.filteredOptions = [];

          const targetName = this.currentCondition.name;

          if (!this.stats.conditionStats[targetName]) {
            this.stats.conditionStats[targetName] = { wins: 0, total: 0 };
          }

          if (guessName === targetName) {
            this.gameStatus = 'won';
            this.stats.played++;
            this.stats.won++;
            this.stats.streak++;
            if (this.stats.streak > this.stats.maxStreak) {
              this.stats.maxStreak = this.stats.streak;
            }
            this.stats.conditionStats[targetName].wins++;
            this.stats.conditionStats[targetName].total++;
            this.saveStats();
          } else {
            if (this.currentClueIndex < 4) {
              this.currentClueIndex++;
            } else {
              this.gameStatus = 'lost';
              this.stats.played++;
              this.stats.streak = 0;
              this.stats.conditionStats[targetName].total++;
              this.saveStats();
            }
          }
        }
      }
